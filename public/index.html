<!DOCTYPE html><!-- v2 --><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><meta name="theme-color" content="#2d1f0e"><title>Wax Ledger</title><style>:root{--ink:#1a1008;--paper:#f5efe6;--cream:#ede4d4;--groove:#2d1f0e;--gold:#c9952a;--red:#b33000;--green:#2a6e3f;--muted:#7a6a55;--rule:#c8b898}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif;min-height:100vh;font-size:15px}header{background:var(--groove);padding:14px 16px;border-bottom:3px solid var(--gold);display:flex;align-items:center;justify-content:space-between}header h1{font-size:1.5rem;color:var(--paper);font-style:italic}header h1 span{color:var(--gold)}.stats-bar{display:flex;gap:14px}.stat .val{font-size:1.1rem;color:var(--gold);font-weight:bold;text-align:right}.stat .lbl{font-size:0.55rem;letter-spacing:1px;text-transform:uppercase;color:#a89070;text-align:right}.tabs{display:flex;background:var(--cream);border-bottom:2px solid var(--rule)}.tab{flex:1;padding:12px;text-align:center;font-size:0.8rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);cursor:pointer;border:none;background:none}.tab.active{color:var(--groove);border-bottom:3px solid var(--gold);font-weight:bold;margin-bottom:-2px}.panel{display:none;padding:16px}.panel.active{display:block}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:0.7rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}.field input,.field select{background:white;border:1.5px solid var(--rule);border-radius:6px;padding:10px 12px;font-size:0.95rem;color:var(--ink);outline:none;width:100%;-webkit-appearance:none}.field input:focus,.field select:focus{border-color:var(--gold)}.photo-zone{border:2px dashed var(--rule);border-radius:10px;padding:28px 16px;text-align:center;cursor:pointer;background:white;position:relative;margin-bottom:16px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.photo-zone input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}.photo-zone .icon{font-size:2.5rem}.photo-zone p{font-size:0.85rem;color:var(--muted);line-height:1.4}.photo-zone strong{color:var(--ink);display:block;font-size:1rem}#preview-img{width:100%;max-height:220px;object-fit:cover;border-radius:8px;border:1px solid var(--rule);display:none;margin-bottom:10px}.btn{display:block;width:100%;padding:14px;border:none;border-radius:8px;font-size:0.9rem;letter-spacing:1px;text-transform:uppercase;cursor:pointer;text-align:center}.btn-primary{background:var(--groove);color:var(--gold);margin-bottom:8px}.btn-primary:disabled{opacity:0.4}.btn-secondary{background:transparent;color:var(--ink);border:1.5px solid var(--rule)}.btn-danger{background:transparent;color:var(--red);border:1px solid #e8c0b0;padding:6px 10px;width:auto;font-size:0.7rem;border-radius:4px}#status{padding:10px 12px;border-radius:6px;margin-bottom:12px;font-size:0.82rem;line-height:1.5;display:none}#status.loading{background:#fff8e6;color:#8b6000;border:1px solid #e8d080;display:block}#status.success{background:#edf7f0;color:var(--green);border:1px solid #a8dab8;display:block}#status.error{background:#fdf0ec;color:var(--red);border:1px solid #f0c0b0;display:block}@keyframes spin{to{transform:rotate(360deg)}}.spinner{display:inline-block;width:12px;height:12px;border:2px solid #e8d080;border-top-color:#8b6000;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px}.filter-bar{display:flex;gap:8px;margin-bottom:12px}.filter-bar input{flex:1;background:white;border:1.5px solid var(--rule);border-radius:6px;padding:9px 12px;font-size:0.85rem;color:var(--ink);outline:none}.filter-bar select{background:white;border:1.5px solid var(--rule);border-radius:6px;padding:9px 8px;font-size:0.8rem;color:var(--ink);outline:none;-webkit-appearance:none}.totals{display:flex;gap:12px;padding:10px 14px;background:var(--groove);border-radius:8px;margin-bottom:14px;flex-wrap:wrap}.total-item .tv{font-size:1.1rem;color:var(--gold);font-weight:bold}.total-item .tl{font-size:0.58rem;letter-spacing:1px;text-transform:uppercase;color:#a89070}.record-card{background:white;border:1px solid var(--rule);border-radius:8px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}.record-thumb{width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--rule);flex-shrink:0}.record-thumb-placeholder{width:60px;height:60px;background:var(--cream);border:1px solid var(--rule);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}.record-info{flex:1;min-width:0}.record-artist{font-weight:600;font-size:0.9rem}.record-title{font-style:italic;color:var(--groove);font-size:0.85rem;margin-bottom:4px}.record-meta{font-size:0.72rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}.record-value{font-size:0.9rem;color:var(--green);font-weight:600}.record-notes{font-size:0.72rem;color:var(--muted);margin-top:2px}.badge{display:inline-block;font-size:0.6rem;padding:1px 5px;border-radius:3px;text-transform:uppercase}.badge-vg{background:#e8f0ff;color:#3058b0}.badge-nm{background:#edf7f0;color:var(--green)}.badge-g{background:#fdf0ec;color:var(--red)}.record-actions{display:flex;align-items:center;gap:8px;margin-top:6px}a.discogs-link{color:var(--gold);font-size:0.72rem;text-decoration:none}.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}.empty-state .icon{font-size:3rem;display:block;margin-bottom:10px}.export-row{display:flex;gap:8px;margin-bottom:14px}.export-row .btn{flex:1;padding:10px;font-size:0.78rem}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body>
<header><h1>Wax <span>Ledger</span></h1><div class="stats-bar"><div class="stat"><div class="val" id="hdr-count">0</div><div class="lbl">Records</div></div><div class="stat"><div class="val" id="hdr-value">$0</div><div class="lbl">Value</div></div></div></header>
<div class="tabs"><button class="tab active" id="tab-btn-add" onclick="showTab('add',this)">+ Add</button><button class="tab" id="tab-btn-collection" onclick="showTab('collection',this)">Collection</button><button class="tab" id="tab-btn-settings" onclick="showTab('settings',this)">Settings</button></div>
<div class="panel active" id="tab-add">
<div id="photo-zone" style="margin-bottom:16px;display:flex;gap:10px">
<div class="photo-zone" style="flex:1;margin-bottom:0" onclick="document.getElementById('camera-input').click()">
<input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">
<div class="icon">📷</div><p><strong>Take Photo</strong></p>
</div>
<div class="photo-zone" style="flex:1;margin-bottom:0" onclick="document.getElementById('gallery-input').click()">
<input type="file" id="gallery-input" accept="image/*" style="display:none">
<div class="icon">🖼️</div><p><strong>From Gallery</strong></p>
</div>
</div>
<img id="preview-img" alt="Preview">
<button class="btn btn-secondary" id="clear-btn" style="display:none;margin-bottom:12px">↩ Clear photo</button>
<div class="grid2">
<div class="field"><label>Artist</label><input type="text" id="f-artist" placeholder="Auto-detected"></div>
<div class="field"><label>Title</label><input type="text" id="f-title" placeholder="Auto-detected"></div>
<div class="field"><label>Year</label><input type="text" id="f-year" placeholder="Auto"></div>
<div class="field"><label>Label</label><input type="text" id="f-label" placeholder="Auto"></div>
<div class="field"><label>Format</label><select id="f-format"><option value="">Auto</option><option value="LP">LP (12")</option><option value="7-inch">7" Single</option><option value="10-inch">10"</option><option value="2xLP">Double LP</option><option value="Box Set">Box Set</option></select></div>
<div class="field"><label>Condition</label><select id="f-condition"><option value="VG+">VG+ (default)</option><option value="NM">Near Mint</option><option value="VG">Very Good</option><option value="G+">Good+</option><option value="G">Good</option></select></div>
</div>
<div class="field"><label>Notes <span id="notes-counter" style="color:var(--muted)">0/256</span></label><input type="text" id="f-notes" placeholder="e.g. original pressing, signed..." maxlength="256"></div>
<div id="status"></div>
<button class="btn btn-primary" id="identify-btn" disabled>⬤ Identify &amp; Add</button>
</div>
<div class="panel" id="tab-collection">
<div class="export-row"><button class="btn btn-secondary" id="export-csv-btn">↓ CSV</button><button class="btn btn-primary" id="export-excel-btn">↓ Excel</button></div>
<div class="filter-bar"><input type="text" id="search-input" placeholder="Search..."><select id="sort-select"><option value="added-desc">Newest</option><option value="artist-asc">Artist A→Z</option><option value="value-desc">Value ↓</option><option value="year-asc">Year ↑</option></select></div>
<div id="totals-row" class="totals" style="display:none"><div class="total-item"><div class="tv" id="tot-records">0</div><div class="tl">Records</div></div><div class="total-item"><div class="tv" id="tot-artists">0</div><div class="tl">Artists</div></div><div class="total-item"><div class="tv" id="tot-value">$0</div><div class="tl">Total</div></div><div class="total-item"><div class="tv" id="tot-median">$0</div><div class="tl">Median</div></div></div>
<div id="records-list"><div class="empty-state"><span class="icon">🎵</span><p>No records yet.<br>Tap "+ Add" to begin.</p></div></div>
</div>
<div class="panel" id="tab-settings">
<div class="field"><label>Anthropic API Key</label><input type="password" id="anthropic-key" placeholder="sk-ant-..." autocomplete="off"></div>
<div class="field"><label>Discogs Token <span style="font-weight:300">(optional)</span></label><input type="password" id="discogs-token" placeholder="Your Discogs user token" autocomplete="off"></div>
<p style="font-size:0.72rem;color:var(--muted);line-height:1.6;margin-top:4px">Keys save automatically. Get Anthropic key at console.anthropic.com. Get Discogs token at discogs.com → Settings → Developers.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let collection=JSON.parse(localStorage.getItem('wax-ledger-v5')||'[]');
let currentImageB64=null;
let currentImageType='image/jpeg';
const save=()=>{try{localStorage.setItem('wax-ledger-v5',JSON.stringify(collection));}catch(e){console.warn('Storage full, thumbnails disabled')}};
const fmt=v=>v?'$'+Number(v).toFixed(2):'—';
const median=arr=>{if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
const esc=s=>s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';

function showTab(name,el){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  $('tab-'+name).classList.add('active');
  el.classList.add('active');
  if(name==='collection')renderList();
}

// Persist keys
const anthEl=$('anthropic-key');
const discEl=$('discogs-token');
anthEl.value=localStorage.getItem('wax-anthropic-key')||'';
discEl.value=localStorage.getItem('wax-discogs-token')||'';
anthEl.addEventListener('input',()=>localStorage.setItem('wax-anthropic-key',anthEl.value));
discEl.addEventListener('input',()=>localStorage.setItem('wax-discogs-token',discEl.value));

// File input with image resize
$('camera-input').addEventListener('change',e=>{if(e.target.files[0])loadImage(e.target.files[0])});
$('gallery-input').addEventListener('change',e=>{if(e.target.files[0])loadImage(e.target.files[0])});

function loadImage(file){
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const max=800;
      let w=img.width,h=img.height;
      if(w>max){h=Math.round(h*max/w);w=max;}
      if(h>max){w=Math.round(w*max/h);h=max;}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const resized=canvas.toDataURL('image/jpeg',0.7);
      currentImageB64=resized.split(',')[1];
      currentImageType='image/jpeg';
      $('preview-img').src=resized;
      $('preview-img').style.display='block';
      $('photo-zone').style.display='none';
      $('clear-btn').style.display='block';
      $('identify-btn').disabled=false;
      setStatus('');
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

$('clear-btn').addEventListener('click',()=>{
  currentImageB64=null;
  $('preview-img').style.display='none';
  $('photo-zone').style.display='flex';
  $('clear-btn').style.display='none';
  $('camera-input').value='';$('gallery-input').value='';
  $('identify-btn').disabled=true;
  setStatus('');
});

function setStatus(msg,type='loading'){
  const el=$('status');
  if(!msg){el.style.display='none';return}
  el.innerHTML=type==='loading'?`<span class="spinner"></span>${msg}`:msg;
  el.className=type;
  el.style.display='block';
}

$('f-notes').addEventListener('input',function(){
  const len=this.value.length;
  $('notes-counter').textContent=len+'/256';
  $('notes-counter').style.color=len>230?'var(--red)':'var(--muted)';
});

$('identify-btn').addEventListener('click',async()=>{
  if(!currentImageB64)return;
  const apiKey=anthEl.value.trim();
  if(!apiKey){setStatus('Go to Settings tab and enter your Anthropic API key.','error');return}
  $('identify-btn').disabled=true;
  try{
    setStatus('Identifying album...');
    const res=await fetch('/api/identify',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey},
      body:JSON.stringify({
        model:'claude-sonnet-4-5',
        max_tokens:500,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:currentImageType,data:currentImageB64}},
          {type:'text',text:'You are a vinyl record expert. Identify this album cover and respond ONLY with valid JSON, no markdown:\n{"artist":"","title":"","year":"","label":"","format":"LP","confidence":"high","notes":""}\nFormat: LP, 7-inch, 10-inch, 2xLP, or Box Set. If unidentifiable: {"error":"Cannot identify"}.'}
        ]}]
      })
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`API error ${res.status}`)}
    const data=await res.json();
    let identified;
    try{identified=JSON.parse(data.content[0].text.replace(/```json|```/g,'').trim())}
    catch(e){throw new Error('Could not parse response')}
    if(identified.error)throw new Error('Album not recognized — try a clearer photo');

    const artist=$('f-artist').value.trim()||identified.artist;
    const title=$('f-title').value.trim()||identified.title;
    const year=$('f-year').value.trim()||identified.year||'';
    const label=$('f-label').value.trim()||identified.label||'';
    const format=$('f-format').value||identified.format||'LP';
    const condition=$('f-condition').value||'VG+';
    const notes=$('f-notes').value.trim()||identified.notes||'';

    let discogsUrl='',marketValue=null;
    const discogsToken=discEl.value.trim();
    if(discogsToken){
      setStatus('Looking up Discogs...');
      try{
        const q=encodeURIComponent(`${artist} ${title}`);
        const sr=await fetch(`/api/discogs/database/search?q=${q}&type=master&per_page=3`,{headers:{'x-discogs-token':discogsToken}});
        const sd=await sr.json();
        if(sd.results?.length){
          const match=sd.results[0];
          discogsUrl=`https://www.discogs.com${match.uri}`;
          try{
            const pr=await fetch(`/api/discogs/marketplace/price_suggestions/${match.id}`,{headers:{'x-discogs-token':discogsToken}});
            if(pr.ok){const ps=await pr.json();const condMap={'NM':'Mint (M)','VG+':'Very Good Plus (VG+)','VG':'Very Good (VG)','G+':'Good Plus (G+)','G':'Good (G)'};if(ps[condMap[condition]])marketValue=ps[condMap[condition]].value}
          }catch(e){}
          if(!marketValue){
            try{const rr=await fetch(`/api/discogs/masters/${match.id}`,{headers:{'x-discogs-token':discogsToken}});if(rr.ok){const rd=await rr.json();if(rd.lowest_price)marketValue=rd.lowest_price}}catch(e){}
          }
        }
      }catch(e){console.warn('Discogs:',e)}
    }

    const record={
      id:Date.now(),artist,title,year,label,format,condition,notes,
      value:marketValue,discogsUrl,
      thumb:currentImageB64,
      addedAt:new Date().toISOString()
    };
    collection.unshift(record);
    save();
    updateStats();
    setStatus(`✓ Added: <strong>${esc(artist)} — ${esc(title)}</strong>${marketValue?' · '+fmt(marketValue):''}`, 'success');
    $('clear-btn').click();
    ['f-artist','f-title','f-year','f-label','f-notes'].forEach(id=>$(id).value='');
    $('f-format').value='';$('f-condition').value='VG+';$('notes-counter').textContent='0/256';
  }catch(err){setStatus(`Error: ${err.message}`,'error')}
  finally{$('identify-btn').disabled=false}
});

function condBadge(c){const cls=c==='NM'?'badge-nm':c==='VG'||c==='VG+'?'badge-vg':'badge-g';return`<span class="badge ${cls}">${c}</span>`}
function getFiltered(){const q=$('search-input').value.toLowerCase();return collection.filter(r=>!q||[r.artist,r.title,r.label,r.year].some(f=>f&&f.toLowerCase().includes(q)))}
function getSorted(rows){const s=$('sort-select').value;return[...rows].sort((a,b)=>{if(s==='artist-asc')return(a.artist||'').localeCompare(b.artist||'');if(s==='value-desc')return(b.value||0)-(a.value||0);if(s==='year-asc')return(a.year||9999)-(b.year||9999);return new Date(b.addedAt)-new Date(a.addedAt)})}

function renderList(){
  const rows=getSorted(getFiltered());
  const list=$('records-list');
  const tr=$('totals-row');
  if(!rows.length){list.innerHTML=`<div class="empty-state"><span class="icon">🎵</span><p>${collection.length?'No matches.':'No records yet.<br>Tap "+ Add" to begin.'}</p></div>`;tr.style.display='none';return}
  tr.style.display='';
  list.innerHTML=rows.map(r=>`<div class="record-card">
    ${r.thumb?`<img class="record-thumb" src="data:image/jpeg;base64,${r.thumb}" alt="">`:`<div class="record-thumb-placeholder">♫</div>`}
    <div class="record-info">
      <div class="record-artist">${esc(r.artist)}</div>
      <div class="record-title">${esc(r.title)}</div>
      <div class="record-meta">${r.year||''}${r.year&&r.label?' · ':''}${esc(r.label||'')}${r.format?' · '+r.format:''} ${condBadge(r.condition)}</div>
      <div class="record-value">${fmt(r.value)}</div>
      ${r.notes?`<div class="record-notes">${esc(r.notes)}</div>`:''}
      <div class="record-actions">
        ${r.discogsUrl?`<a class="discogs-link" href="${r.discogsUrl}" target="_blank">↗ Discogs</a>`:''}
        <button class="btn btn-danger" onclick="deleteRecord(${r.id})">✕ Remove</button>
      </div>
    </div>
  </div>`).join('');
}

window.deleteRecord=id=>{if(!confirm('Remove this record?'))return;collection=collection.filter(r=>r.id!==id);save();renderList();updateStats()};

function updateStats(){
  const vals=collection.filter(r=>r.value).map(r=>r.value);
  const total=vals.reduce((a,b)=>a+b,0);
  const artists=new Set(collection.map(r=>r.artist)).size;
  $('hdr-count').textContent=collection.length;
  $('hdr-value').textContent=total>=1000?'$'+(total/1000).toFixed(1)+'k':'$'+Math.round(total);
  $('tot-records').textContent=collection.length;
  $('tot-artists').textContent=artists;
  $('tot-value').textContent='$'+total.toFixed(2);
  $('tot-median').textContent='$'+median(vals).toFixed(2);
}

$('search-input').addEventListener('input',renderList);
$('sort-select').addEventListener('change',renderList);

$('export-csv-btn').addEventListener('click',()=>{
  const rows=[['Artist','Title','Year','Label','Format','Condition','Value','Discogs URL','Notes','Date']];
  collection.forEach(r=>rows.push([r.artist,r.title,r.year,r.label,r.format,r.condition,r.value||'',r.discogsUrl,r.notes,r.addedAt.split('T')[0]]));
  const csv=rows.map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='wax-ledger.csv';a.click();
});

$('export-excel-btn').addEventListener('click',()=>{
  const wsData=[['Artist','Title','Year','Label','Format','Condition','Value','Discogs URL','Notes','Date']];
  collection.forEach(r=>wsData.push([r.artist,r.title,r.year,r.label,r.format,r.condition,r.value||'',r.discogsUrl,r.notes,r.addedAt.split('T')[0]]));
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols']=[20,28,8,18,10,10,12,30,25,12].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws,'Collection');
  const vals=collection.filter(r=>r.value).map(r=>r.value);
  const sum=[['Wax Ledger'],[],['Records',collection.length],['Artists',new Set(collection.map(r=>r.artist)).size],['Total','$'+vals.reduce((a,b)=>a+b,0).toFixed(2)],['Median','$'+median(vals).toFixed(2)],['Date',new Date().toLocaleDateString()]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),'Summary');
  XLSX.writeFile(wb,'wax-ledger.xlsx');
});

updateStats();
</script>
</body></html>
